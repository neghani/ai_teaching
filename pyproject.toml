[project]
name = "docai"
version = "0.1.0"
description = "Reference implementations for production-grade document AI: grounded extraction, verification, evaluation, and human review."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pypdf>=4.0",
    "fpdf2>=2.7",
    "rapidfuzz>=3.0",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
docai = "docai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
